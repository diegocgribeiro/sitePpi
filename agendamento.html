<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clínica F&G - Agendamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style_agendamento.css">
</head>

<body>
    <header>
        <div>
            <h3 class="central">Central de Atendimento: (34) 3232-3232</h3>
        </div>

        <nav class="navbar-custom">
            <div class="container">

                <a href="index.html" class="navbar-logo">
                    <img src="images/logo-sem-fundo.png" alt="Logo da Clínica">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <ul class="collapse navbar-nav-custom" id="navbarNav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="galeria.html">Galeria</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                    <li class="nav-item"><a class="nav-link active" href="agendamento.html">Agendamento</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>

            </div>
        </nav>
    </header>
    <main>
        <section class="agendamento-form">
            <h2>Agende sua Consulta</h2>
            <form action="agendamento.php" method="GET" class="formulario" name="agendamento">
                <div class="grupo-form">
                    <label for="name">Nome Completo:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="grupo-form">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="grupo-form">
                    <label for="phone">Telefone:</label>
                    <input type="tel" id="phone" name="phone" placeholder="(XX) XXXXX-XXXX"
                        pattern="[0-9]{2}[0-9]{4,5}[0-9]{4}" required>
                </div>

                <div class="grupo-form">
                    <label for="sexo">Sexo:</label>
                    <select id="sexo" name="sexo" required>
                        <option selected disabled value="">Sexo</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="grupo-form">
                    <label for="select-especialidade">Especialidade:</label>
                    <select id="select-especialidade" name="select-especialidade" required>
                        <option value="">Selecione uma especialidade</option>
                        <option value="Clinico geral">Clínico Geral</option>
                        <option value="Dermatologia">Dermatologia</option>
                        <option value="Cardiologia">Cardiologia</option>
                        <option value="Pediatria">Pediatria</option>
                        <option value="Ginecologia">Ginecologia</option>
                    </select>
                </div>

                <div class="grupo-form">
                    <label for="select-medico">Medico:</label>
                    <select id="select-medico" name="select-medico" required>
                        <option value="">Selecione um médico</option>
                    </select>
                </div>

                <div class="grupo-form">
                    <label for="date">Data Preferencial:</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="grupo-form">
                    <label for="time">Horário Preferencial:</label>
                    <input type="time" id="time" name="time" required>
                </div>

                <div class="grupo-form">
                    <label for="mensagem">Mensagem (opcional):</label>
                    <textarea id="message" name="mensagem" rows="4"></textarea>
                </div>

                <button type="submit">Agendar Consulta</button>
                <p class="text-secondary">Após a confirmação de sua consulta, você receberá um e-mail com os detalhes
                </p>
            </form>
        </section>

    </main>

    <footer class=" text-white text-center p-3">
        <div class="container">
            <p>&copy; 2025 - Clínica F&G. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const selecionaEspec = document.getElementById("select-especialidade");
        const medicoSelect = document.getElementById('select-medico');

        async function buscaMedico(especialidade) {
            medicoSelect.innerHTML = '<option value="">Carregando...</option>';
            medicoSelect.disabled = true;

            try {
                if (!especialidade) {
                    medicoSelect.innerHTML = '<option value="">Selecione uma especialidade</option>';
                    return;
                }

                const response = await fetch('buscar-medicos.php?especialidade='+ especialidade);

                if (!response.ok) {
                    throw new Error("Falha inesperada: " + response.status);
                }

                const medicos = await response.json();

                medicoSelect.innerHTML = '<option value="">Selecione o médico</option>';

                medicos.forEach(medico => {
                    const option = document.createElement("option");
                    option.setAttribute('name', 'nomeMed');
                    option.textContent = medico.nomeMed; 
                    medicoSelect.appendChild(option);
                });

                if (medicos.length > 0) {
                    medicoSelect.disabled = false;
                }

            } catch (e) {
                console.error(e);
                medicoSelect.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        selecionaEspec.onchange = function () {
            buscaMedico(selecionaEspec.value);
        }
    </script>
</body>

</html>
